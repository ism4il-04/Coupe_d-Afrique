<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéos - CAN 2024</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="videos.css">
</head>
<body>  
    
    <!-- Barre Interactive -->
    <div class="interactive-bar">
        <div class="interactive-content">
            <div id="logo-container">
                <i><img src="Images/téléchargement.png" alt="Logo CAN" height="100" width="180" ></i>
            </div>
            <div class="interactive-item" data-section="can2025-description">
                <i class="fas fa-info-circle"></i>
                <span>À propos</span>
            </div>
            <div class="interactive-item" data-section="maroc">
                <i class="fas fa-map-marker-alt"></i>
                <span>Maroc</span>
            </div>
            <div class="interactive-item" data-section="matches">
                <i class="fas fa-futbol"></i>
                <span>Matches</span>
            </div>
            <div class="interactive-item" data-section="groups">
                <i class="fas fa-users"></i>
                <span>Groupes</span>
            </div>
            <div class="interactive-item active" data-section="videos">
                <i class="fas fa-play-circle"></i>
                <span>Vidéos</span>
            </div>
            <div class="interactive-item" data-section="stats">
                <i class="fas fa-chart-bar"></i>
                <span>Stats</span>
            </div>
            <div class="interactive-item" data-section="teams">
                <i class="fas fa-flag"></i>
                <span>Équipes</span>
            </div>
        </div>
    </div>
    <!-- Hero Section -->
    <div class="hero-section">
        <div class="container">
            <h1 class="display-4 text-white">Vidéos CAN 2024</h1>
            <p class="lead text-white">Revivez les meilleurs moments de la Coupe d'Afrique des Nations</p>
        </div>
    </div>


    <!-- Filtres Section -->
    <div class="container mt-4">
        <div class="filters-section">
            <div class="row">
                <div class="col-md-4">
                    <select class="form-select" id="categoryFilter">
                        <option value="all">Toutes les catégories</option>
                        <option value="highlights">Meilleurs moments</option>
                        <option value="interviews">Interviews</option>
                        <option value="resumes">Résumés de matchs</option>
                        <option value="reportages">Reportages</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="teamFilter">
                        <option value="all">Toutes les équipes</option>
                        <!-- Les équipes seront ajoutées dynamiquement -->
                    </select>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchInput" placeholder="Rechercher une vidéo...">
                        <button class="btn btn-primary" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vidéos Grid -->
    <div class="container mt-4">
        <div class="row" id="videosGrid">
            <!-- Les vidéos seront générées dynamiquement ici -->
        </div>
    </div>

    <!-- Modal pour la lecture vidéo -->
    <div class="modal fade" id="videoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Titre de la vidéo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="video-container">
                        <iframe width="100%" height="500" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="video-info mt-3">
                        <h4 class="video-title"></h4>
                        <p class="video-description"></p>
                        <div class="video-meta">
                            <span class="video-date"></span>
                            <span class="video-category"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white mt-5">
        <div class="container py-4">
            <div class="row">
                <div class="col-md-6">
                    <h5>CAN 2024</h5>
                    <p>Suivez tous les matchs de la Coupe d'Afrique des Nations 2024 en Côte d'Ivoire.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <h5>Suivez-nous</h5>
                    <div class="social-links">
                        <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="videos.js"></script>
    <script>
    window.addEventListener('scroll', function() {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 10) {
            navbar.classList.add('sticky-shadow');
        } else {
            navbar.classList.remove('sticky-shadow');
        }
    });
    </script>
</body>
</html>
