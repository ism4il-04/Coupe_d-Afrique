<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéos - CAN 2024</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="videos.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top py-4" style="min-height:110px;">
        <div class="container">
            <a class="navbar-brand" href="home_page.html">
                <img src="Images/CAN.jpeg" alt="CAN Logo" width="90" height="90">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav fs-5">
                    <li class="nav-item">
                        <a class="nav-link" href="home_page.html">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="matches.html">Matches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="groupes.html">Groupes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="videos.html">Vidéos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="stats.html">Stats</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="equipes.html">Équipes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="container">
            <h1 class="display-4 text-white">Vidéos CAN 2024</h1>
            <p class="lead text-white">Revivez les meilleurs moments de la Coupe d'Afrique des Nations</p>
        </div>
    </div>

    <!-- Filtres Section -->
    <div class="container mt-4">
        <div class="filters-section">
            <div class="row">
                <div class="col-md-4">
                    <select class="form-select" id="categoryFilter">
                        <option value="all">Toutes les catégories</option>
                        <option value="highlights">Meilleurs moments</option>
                        <option value="interviews">Interviews</option>
                        <option value="resumes">Résumés de matchs</option>
                        <option value="reportages">Reportages</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="teamFilter">
                        <option value="all">Toutes les équipes</option>
                        <!-- Les équipes seront ajoutées dynamiquement -->
                    </select>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchInput" placeholder="Rechercher une vidéo...">
                        <button class="btn btn-primary" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vidéos Grid -->
    <div class="container mt-4">
        <div class="row" id="videosGrid">
            <!-- Les vidéos seront générées dynamiquement ici -->
        </div>
    </div>

    <!-- Modal pour la lecture vidéo -->
    <div class="modal fade" id="videoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Titre de la vidéo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="video-container">
                        <iframe width="100%" height="500" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <div class="video-info mt-3">
                        <h4 class="video-title"></h4>
                        <p class="video-description"></p>
                        <div class="video-meta">
                            <span class="video-date"></span>
                            <span class="video-category"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white mt-5">
        <div class="container py-4">
            <div class="row">
                <div class="col-md-6">
                    <h5>CAN 2024</h5>
                    <p>Suivez tous les matchs de la Coupe d'Afrique des Nations 2024 en Côte d'Ivoire.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <h5>Suivez-nous</h5>
                    <div class="social-links">
                        <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="videos.js"></script>
    <script>
    window.addEventListener('scroll', function() {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 10) {
            navbar.classList.add('sticky-shadow');
        } else {
            navbar.classList.remove('sticky-shadow');
        }
    });
    </script>
</body>
</html>
