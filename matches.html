<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN 2025 - Matches</title>
    <link rel="stylesheet" href="bootstrap-5.3.5-dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="matches.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<!-- Barre Interactive -->
<div class="interactive-bar">
    <div class="interactive-content">
        <div id="logo-container">
            <i><img src="Images/téléchargement.png" alt="Logo CAN" height="100" width="180" ></i>
        </div>
        <div class="interactive-item" data-section="can2025-description">
            <i class="fas fa-home home-icon"></i>
            <span>Accueil</span>
        </div>
        <div class="interactive-item" data-section="maroc">
            <i class="fas fa-map-marker-alt"></i>
            <span>Maroc</span>
        </div>
        <div class="interactive-item active" data-section="matches">
            <i class="fas fa-futbol"></i>
            <span>Matches</span>
        </div>
        <div class="interactive-item" data-section="groups">
            <i class="fas fa-users"></i>
            <span>Groupes</span>
        </div>
        <div class="interactive-item" data-section="videos">
            <i class="fas fa-play-circle"></i>
            <span>Vidéos</span>
        </div>
        <div class="interactive-item" data-section="stats">
            <i class="fas fa-map-marked-alt"></i>
            <span>Stades et villes hôtes</span>
        </div>
        <div class="interactive-item" data-section="teams">
            <i class="fas fa-flag"></i>
            <span>Équipes</span>
        </div>
    </div>
</div>
    <!-- Barre Calendrier -->
    <div class="calendar-bar d-flex align-items-center">
        <div class="calendar-nav" onclick="scrollCalendar(-1)">&#8592;</div>
        <div id="calendarDates" class="d-flex flex-nowrap overflow-auto w-100"></div>
        <div class="calendar-nav" onclick="scrollCalendar(1)">&#8594;</div>
    </div>

    <script type="text/javascript" src="bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="matches.js"></script>
</body>
</html>
