<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Équipes - CAN 2025</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="equipes.css">
</head>
<body>
    <!-- Barre Interactive -->
    <div class="interactive-bar">
        <div class="interactive-content">
            <div id="logo-container">
                <img src="Images/téléchargement.png" alt="Logo CAN" height="100" width="180">
            </div>
            <div class="interactive-item" data-section="can2025-description">
                <i class="fas fa-info-circle"></i>
                <span>À propos</span>
            </div>
            <div class="interactive-item" data-section="maroc">
                <i class="fas fa-map-marker-alt"></i>
                <span>Maroc</span>
            </div>
            <div class="interactive-item" data-section="matches">
                <i class="fas fa-futbol"></i>
                <span>Matches</span>
            </div>
            <div class="interactive-item" data-section="groups">
                <i class="fas fa-users"></i>
                <span>Groupes</span>
            </div>
            <div class="interactive-item" data-section="videos">
                <i class="fas fa-play-circle"></i>
                <span>Vidéos</span>
            </div>
            <div class="interactive-item" data-section="stats">
                <i class="fas fa-chart-bar"></i>
                <span>Stats</span>
            </div>
            <div class="interactive-item active" data-section="teams">
                <i class="fas fa-flag"></i>
                <span>Équipes</span>
            </div>
        </div>
    </div>

    <!-- En-tête de la page -->
    <header class="teams-header">
        <div class="container">
            <h1>Équipes Qualifiées</h1>
            <p>Découvrez les 24 équipes participant à la CAN 2025 au Maroc</p>
        </div>
    </header>

    <!-- Filtres -->
    <section class="filters-section">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0" id="searchTeam" placeholder="Rechercher une équipe...">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="fas fa-users"></i>
                        </span>
                        <select class="form-select border-start-0" id="groupFilter">
                            <option value="all">Tous les groupes</option>
                            <option value="A">Groupe A</option>
                            <option value="B">Groupe B</option>
                            <option value="C">Groupe C</option>
                            <option value="D">Groupe D</option>
                            <option value="E">Groupe E</option>
                            <option value="F">Groupe F</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Liste des équipes -->
    <section class="teams-section">
        <div class="container">
            <div class="row" id="teamsContainer">
                <!-- Les équipes seront ajoutées dynamiquement ici via JavaScript -->
            </div>
        </div>
    </section>

    <!-- Modal pour les détails de l'équipe -->
    <div class="modal fade" id="teamModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0 p-0">
                    <button type="button" class="btn-close position-absolute top-0 end-0 m-3 bg-white" data-bs-dismiss="modal"></button>
                </div>
                <div id="teamModalContent">
                    <!-- Le contenu sera ajouté dynamiquement -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer bg-dark text-white mt-5">
        <div class="container py-4">
            <div class="row">
                <div class="col-md-6">
                    <h5>CAN 2025 - Maroc</h5>
                    <p>La plus grande compétition de football africain</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="social-links">
                        <a href="#" class="text-white me-3"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="text-white"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="equipes.js"></script>
    <script>
        // Gestion de la barre interactive
        document.addEventListener('DOMContentLoaded', () => {
            const interactiveItems = document.querySelectorAll('.interactive-item');
            
            // Gestion du clic sur le logo pour retourner à la page d'accueil
            const logoContainer = document.getElementById('logo-container');
            if (logoContainer) {
                logoContainer.addEventListener('click', () => {
                    window.location.href = 'home_page.html';
                });
                // Ajouter le style du curseur pointer
                logoContainer.style.cursor = 'pointer';
            }
            
            // Gestion du clic sur les éléments de la barre
            interactiveItems.forEach(item => {
                item.addEventListener('click', () => {
                    const section = item.dataset.section;
                    
                    // Redirection vers les pages correspondantes
                    switch(section) {
                        case 'can2025-description':
                        case 'maroc':
                            window.location.href = `home_page.html#${section}`;
                            break;
                        case 'matches':
                            window.location.href = 'matches.html';
                            break;
                        case 'groups':
                            window.location.href = 'groupes.html';
                            break;
                        case 'videos':
                            window.location.href = 'videos.html';
                            break;
                        case 'stats':
                            window.location.href = 'stats.html';
                            break;
                        case 'teams':
                            // Déjà sur la page des équipes
                            break;
                    }
                });
            });
        });
    </script>
</body>
</html>
